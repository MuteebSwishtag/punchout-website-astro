/* ==========================================================
   PunchOut Central — PunchOut Central Product Theme
   Full PunchOut Central palette + #99FEEC PunchOut CTA identity
   ========================================================== */
:root{
  --lime:#C2FF02;
  --peach:#FFBD9B;
  --lavender:#D9D6FD;
  --mint:#99FEED;
  --punchout:#99FEEC;
  --punchout-dark:#216E65;
  --punchout-soft:#E9FFFB;

  --white:#FFFFFF;
  --gray:#F5F5F3;
  --graphite:#202124;
  --muted:#696A6D;
  --line:rgba(32,33,36,.105);

  --b:var(--punchout);
  --b2:#73E8D7;
  --bink:var(--punchout-dark);
  --bd:var(--graphite);
  --bs:var(--punchout-soft);
  --ink:var(--graphite);
  --txt:#2B2E33;
  --mut:var(--muted);
  --soft:var(--gray);
  --shadow:0 24px 70px rgba(32,33,36,.08);
  --max:1200px;
}

::selection{background:var(--punchout);color:var(--graphite)}
body{
  color:var(--txt);
  background:
    radial-gradient(circle at 88% 4%,rgba(217,214,253,.34),transparent 24%),
    radial-gradient(circle at 70% 16%,rgba(153,254,237,.22),transparent 25%),
    #fff;
}
.wrap,.nav{width:min(var(--max),calc(100% - 48px))}

/* Navigation */
header{
  position:fixed;
  inset:0 0 auto;
  height:auto;
  padding:14px 0;
  background:transparent;
  border:0;
  box-shadow:none;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}
header.sc{
  background:rgba(255,255,255,.78);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}
.nav{
  min-height:62px;
  padding:0 10px 0 18px;
  border:1px solid rgba(255,255,255,.88);
  border-radius:999px;
  background:rgba(255,255,255,.78);
  box-shadow:0 12px 42px rgba(32,33,36,.06);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
}
.mark{
  background:linear-gradient(145deg,rgba(255,255,255,.52),transparent),var(--punchout);
  box-shadow:inset 0 0 0 1px rgba(32,33,36,.07);
}
.mark:before,.mark:after{background:var(--graphite)}
.dnav>a,.drop>button{color:#44484E}
.dnav>a:hover,.drop>button:hover{color:var(--graphite)}
.panel{
  border-color:var(--line);
  border-radius:21px;
  box-shadow:0 20px 58px rgba(32,33,36,.09);
}
.panel a:hover{background:var(--gray)}

/* CTA system: PunchOut Central owns mint */
.btn{
  min-height:52px;
  border-radius:999px;
  padding-inline:23px;
}
.pri{
  color:var(--graphite);
  background:var(--punchout);
  border-color:var(--punchout);
  box-shadow:0 11px 26px rgba(111,229,211,.22);
}
.pri:hover{
  background:#7CEEDD;
  border-color:#7CEEDD;
  box-shadow:0 15px 32px rgba(111,229,211,.27);
}
.secbtn{
  color:var(--graphite);
  background:rgba(255,255,255,.78);
  border-color:rgba(32,33,36,.20);
}
.secbtn:hover{
  background:#fff;
  border-color:var(--graphite);
}
.ghost{color:var(--graphite)}
.mini.primary{
  color:var(--graphite);
  background:var(--punchout);
  border-color:var(--punchout);
}

/* Typography */
.ey{
  color:var(--muted);
  letter-spacing:.14em;
}
.ey:before{background:var(--lime)}
.sec{padding:116px 0}
h2{
  font-size:clamp(38px,4.55vw,64px);
  line-height:1;
  letter-spacing:-.052em;
}
.lead{color:var(--muted)}
.soft{
  background:
    radial-gradient(circle at 10% 8%,rgba(153,254,237,.11),transparent 24%),
    var(--gray);
}
.blue-soft{
  background:
    radial-gradient(circle at 90% 9%,rgba(217,214,253,.26),transparent 24%),
    radial-gradient(circle at 10% 88%,rgba(255,189,155,.13),transparent 24%),
    #FBFBF9;
}

/* ==========================================================
   HERO — clean logo network, no visual container/card
   ========================================================== */
.pc-hero{
  min-height:720px;
  padding:122px 0 48px;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 82% 15%,rgba(217,214,253,.42),transparent 27%),
    radial-gradient(circle at 72% 62%,rgba(153,254,237,.30),transparent 29%),
    radial-gradient(circle at 52% 100%,rgba(255,189,155,.12),transparent 28%),
    linear-gradient(180deg,#fff 0%,#FBFBF8 100%);
}
.pc-hero::before{
  content:"";
  position:absolute;
  z-index:-1;
  right:5%;
  top:17%;
  width:110px;
  height:82px;
  opacity:.30;
  background-image:radial-gradient(circle,rgba(32,33,36,.14) 0 1px,transparent 1.5px);
  background-size:12px 12px;
  -webkit-mask-image:linear-gradient(135deg,#000,transparent 88%);
  mask-image:linear-gradient(135deg,#000,transparent 88%);
}
.pc-hero>.wrap{
  width:min(1200px,calc(100% - 48px))!important;
  max-width:1200px;
  margin-inline:auto;
}
.pc-hero__grid{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,.97fr) minmax(0,1.03fr);
  gap:50px;
  align-items:center;
}
.pc-hero__copy{
  min-width:0;
  max-width:610px;
}
.pc-hero h1{
  margin:0;
  max-width:610px;
  color:var(--graphite);
  font-size:clamp(3.6rem,5.65vw,6.3rem);
  line-height:.92;
  letter-spacing:-.072em;
  font-weight:800;
}
.pc-hero .lead{
  max-width:594px;
  margin-top:23px;
  font-size:clamp(.96rem,1.15vw,1.08rem);
  line-height:1.67;
}
.pc-hero .acts{margin:27px 0 0}
.pc-hero__proof{
  margin-top:20px;
  color:var(--muted);
  font-size:12px;
}
.pc-hero__proof i{background:rgba(32,33,36,.20)}

/* right side always stays within its column */
.pc-hero__visual{
  width:min(100%,590px);
  max-width:590px;
  min-width:0;
  min-height:440px;
  justify-self:end;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.pc-gateway-map{
  width:100%;
  max-width:590px;
  min-width:0;
  min-height:410px;
  display:grid;
  grid-template-columns:minmax(150px,.92fr) minmax(166px,1fr) minmax(150px,.92fr);
  align-items:center;
  gap:10px;
  position:relative;
  isolation:isolate;
}
.pc-gateway-map::before{
  content:"";
  position:absolute;
  z-index:-3;
  left:50%;
  top:50%;
  width:330px;
  height:330px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(153,254,237,.24) 34%,rgba(217,214,253,.11) 55%,transparent 72%);
}
.pc-gateway-map::after{
  content:"";
  position:absolute;
  z-index:-3;
  left:50%;
  top:50%;
  width:420px;
  height:220px;
  transform:translate(-50%,-50%) rotate(-7deg);
  border:1px solid rgba(32,33,36,.065);
  border-radius:50%;
}

/* hero logos only — equal optical height, real aspect ratios, no visible text */
.pc-logo-stack{
  display:grid;
  gap:9px;
}
.pc-logo-node{
  --logo-scale:1;
  width:100%;
  min-width:0;
  height:55px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  background:transparent;
  box-shadow:none;
  overflow:visible;
  transition:transform .2s ease,opacity .2s ease;
}
.pc-logo-node:hover{transform:translateY(-1px)}
.pc-logo-node__logo{
  display:block;
  width:auto;
  height:22px;
  max-width:158px;
  object-fit:contain;
  object-position:center;
  transform:scale(var(--logo-scale));
  transform-origin:center;
}
.pc-logo-node.is-coming-soon .pc-logo-node__logo{
  filter:grayscale(1) saturate(0) contrast(1.12);
  opacity:.58;
}
.pc-logo-node.is-ready .pc-logo-node__logo{
  filter:none;
  opacity:1;
}

/* Multiple dotted lines. The dash animation itself is the moving sync signal. */
.pc-gateway-map__connectors{
  position:absolute;
  z-index:1;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}
.pc-connector{
  fill:none;
  stroke:rgba(49,107,99,.70);
  stroke-width:1.08;
  stroke-linecap:butt;
  stroke-dasharray:8 7;
  animation:pcConnectorTravel 2.4s linear infinite;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 1px rgba(49,107,99,.14));
}
.pc-connector--2{animation-delay:-.34s}
.pc-connector--3{animation-delay:-.68s}
.pc-connector--4{animation-delay:-1.02s}
.pc-connector--5{animation-delay:-1.36s}
.pc-connector--6{animation-delay:-.22s}
.pc-connector--7{animation-delay:-.78s}
.pc-connector--8{animation-delay:-1.34s}
@keyframes pcConnectorTravel{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-60}
}
}

/* Central PunchOut hub */
.pc-gateway-map__center{
  position:relative;
  z-index:3;
  min-width:0;
  display:grid;
  place-items:center;
}
.pc-hub{
  width:164px;
  height:164px;
  position:relative;
  display:grid;
  place-items:center;
}
.pc-hub__ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(32,33,36,.075);
  animation:pcHubBreathe 4.8s ease-in-out infinite;
}
.pc-hub__ring--one{inset:-16px}
.pc-hub__ring--two{
  inset:-31px;
  opacity:.65;
  animation-delay:-2.4s;
}
@keyframes pcHubBreathe{
  0%,100%{transform:scale(1);opacity:.62}
  50%{transform:scale(1.025);opacity:.92}
}
.pc-hub__core{
  width:150px;
  height:150px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(32,33,36,.08);
  border-radius:50%;
  background:
    radial-gradient(circle at 70% 18%,rgba(255,255,255,.72),transparent 25%),
    var(--punchout);
  box-shadow:
    0 20px 46px rgba(32,33,36,.09),
    inset 0 0 0 8px rgba(255,255,255,.24);
}
.pc-hub__kicker{
  margin-bottom:6px;
  color:#326D65;
  font-size:.39rem;
  font-weight:800;
  letter-spacing:.10em;
  text-transform:uppercase;
}
.pc-hub__core strong{
  color:var(--graphite);
  font-size:1.10rem;
  line-height:.96;
  letter-spacing:-.05em;
}
.pc-hub__core small{
  margin-top:7px;
  color:rgba(32,33,36,.59);
  font-size:.42rem;
  font-weight:800;
  letter-spacing:.075em;
}

/* ==========================================================
   Full-site PunchOut Central treatment
   Neutral corporate foundation + controlled brand accents
   ========================================================== */
.pc-capability-strip{
  padding:0;
  border-block:1px solid var(--line);
  background:rgba(245,245,243,.86);
}
.pc-capability-strip__inner{
  min-height:66px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.pc-capability-strip__inner span{
  display:flex;
  align-items:center;
  gap:7px;
  padding:13px 15px;
  color:var(--muted);
  font-size:.62rem;
  line-height:1.35;
}
.pc-capability-strip__inner span+span{border-left:1px solid var(--line)}
.pc-capability-strip__inner i{
  width:6px;
  height:6px;
  flex:0 0 6px;
  border-radius:50%;
  background:var(--punchout-dark);
}
.pc-capability-strip__inner b{color:var(--graphite)}

.buyer,.stage,.choice article,.txcard,.dash,.debug,.industry,.proof{
  border-color:var(--line);
  box-shadow:0 14px 38px rgba(32,33,36,.045);
}
.buyer,.choice article,.industry{border-radius:20px}
.bi,.ii{
  color:var(--graphite);
  background:var(--gray);
}
.buyers .buyer:nth-child(1) .bi{background:rgba(153,254,237,.46)}
.buyers .buyer:nth-child(2) .bi{background:rgba(217,214,253,.58)}
.buyers .buyer:nth-child(3) .bi{background:rgba(255,189,155,.48)}
.connected,.state,.status{color:#19735C}

.stagebar,.dashtop{background:#F8F8F6}
.config{
  background:
    radial-gradient(circle at 90% 10%,rgba(217,214,253,.18),transparent 27%),
    #F8F8F6;
}
.conn.live{
  border-color:rgba(32,33,36,.08);
  background:rgba(153,254,237,.10);
}
.add{
  color:var(--graphite);
  border-color:rgba(32,33,36,.16);
  background:rgba(153,254,237,.18);
}
.cbadge{
  color:var(--graphite);
  background:rgba(153,254,237,.38);
}
.choice article:nth-child(1){
  background:
    radial-gradient(circle at 90% 8%,rgba(153,254,237,.24),transparent 27%),
    #fff;
}
.choice article:nth-child(2){
  background:
    radial-gradient(circle at 90% 8%,rgba(217,214,253,.28),transparent 27%),
    #fff;
}
.choice article:hover,.industry:hover:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 44px rgba(32,33,36,.065);
}

/* Workflow keeps the PunchOut Central palette but stays restrained */
.step{
  border-color:var(--line);
  box-shadow:none;
  background:#fff;
}
.step:nth-child(1){background:rgba(153,254,237,.20)}
.step:nth-child(2){background:#fff}
.step:nth-child(3){background:rgba(217,214,253,.24)}
.step:nth-child(4){background:rgba(255,189,155,.22)}
.step:nth-child(5){background:rgba(194,255,2,.15)}
.step .num{
  color:var(--graphite);
  background:rgba(255,255,255,.76);
}
.step:after{
  color:var(--graphite);
  background:var(--punchout);
}
.timeline-dot,.dot{
  background:var(--punchout-dark)!important;
  box-shadow:0 0 0 1px var(--punchout-dark)!important;
}
.node[style]{
  border-color:rgba(32,33,36,.08)!important;
  background:rgba(153,254,237,.16)!important;
}

/* Dashboard */
.metric{
  border-color:var(--line);
  background:#fff;
}
.metric:nth-child(1){background:rgba(153,254,237,.17)}
.metric:nth-child(2){background:rgba(217,214,253,.17)}
.metric:nth-child(3){background:rgba(255,189,155,.16)}
.metric:nth-child(4){background:rgba(194,255,2,.10)}
.metric:nth-child(5){background:#fff}

/* Debugger */
.alert{
  border-color:rgba(32,33,36,.10);
  background:#F8F8F6;
}
.alert b,.alert small{color:var(--graphite)}
.di{background:#EAF7F1}

/* Industries */
.industry{background:#fff}
.industries .industry:nth-child(1){background:linear-gradient(180deg,rgba(153,254,237,.16),#fff 54%)}
.industries .industry:nth-child(2){background:linear-gradient(180deg,rgba(217,214,253,.16),#fff 54%)}
.industries .industry:nth-child(3){background:linear-gradient(180deg,rgba(255,189,155,.15),#fff 54%)}
.industries .industry:nth-child(4){background:linear-gradient(180deg,rgba(194,255,2,.09),#fff 54%)}
.industries .industry:nth-child(5),.industries .industry:nth-child(6){background:#fff}

.proof{
  background:
    radial-gradient(circle at 4% 5%,rgba(153,254,237,.15),transparent 29%),
    radial-gradient(circle at 94% 90%,rgba(217,214,253,.14),transparent 28%),
    #fff;
}
.pnode[style]{
  background:var(--punchout-soft)!important;
  border-color:rgba(32,33,36,.08)!important;
}

/* Pricing teaser */
.pricing{
  border-color:rgba(32,33,36,.08);
  background:
    radial-gradient(circle at 86% 12%,rgba(153,254,237,.28),transparent 27%),
    radial-gradient(circle at 8% 92%,rgba(217,214,253,.18),transparent 27%),
    #FBFBF9;
}

/* Enterprise */
.dark{
  color:#fff;
  background:
    radial-gradient(circle at 12% 10%,rgba(153,254,237,.10),transparent 26%),
    radial-gradient(circle at 89% 72%,rgba(217,214,253,.10),transparent 28%),
    var(--graphite);
}
.dark .ey{color:rgba(255,255,255,.62)}
.dark .ey:before{background:var(--punchout)}
.epanel{
  border-color:rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
}
.enode{background:rgba(255,255,255,.055)}
.dark .secbtn{
  color:var(--graphite);
  background:var(--punchout);
  border-color:var(--punchout);
}

/* FAQ + final CTA */
.fi.open .plus{
  color:var(--graphite);
  border-color:var(--punchout);
  background:var(--punchout);
}
.cta{
  padding:116px 0;
  background:
    radial-gradient(circle at 17% 18%,rgba(153,254,237,.28),transparent 27%),
    radial-gradient(circle at 84% 15%,rgba(217,214,253,.32),transparent 27%),
    radial-gradient(circle at 76% 85%,rgba(255,189,155,.22),transparent 28%),
    linear-gradient(180deg,#fff,#F8F8F5);
}
footer{
  border-top:1px solid var(--line);
  background:var(--gray);
}
footer nav a:hover{color:var(--graphite)}


/* Sticky section navigation / scroll spy */
section[id]{scroll-margin-top:150px}
.pc-subnav{position:sticky;top:88px;z-index:35;border-bottom:1px solid rgba(32,33,36,.08);background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.pc-subnav__inner{min-height:56px;display:flex;align-items:center;gap:22px}
.pc-subnav__label{flex:0 0 auto;color:var(--muted);font-size:.60rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
.pc-subnav__scroll{min-width:0;display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none}.pc-subnav__scroll::-webkit-scrollbar{display:none}
.pc-subnav__link{flex:0 0 auto;padding:8px 12px;border-radius:999px;color:#62666D;font-size:.69rem;font-weight:700;transition:background .2s ease,color .2s ease}
.pc-subnav__link:hover{color:var(--graphite);background:var(--gray)}
.pc-subnav__link.is-active{color:var(--graphite);background:var(--punchout)}


/* Interactive Integrations Lab */
.pc-integrations{
  overflow:hidden;
  background:
    radial-gradient(circle at 8% 8%,rgba(217,214,253,.20),transparent 24%),
    radial-gradient(circle at 92% 88%,rgba(153,254,237,.17),transparent 24%),
    #fff;
}

.pc-integration-lab{
  margin-top:46px;
  padding:26px;
  border:1px solid rgba(32,33,36,.08);
  border-radius:30px;
  background:rgba(249,250,248,.90);
  box-shadow:0 24px 62px rgba(32,33,36,.055);
}

/* One row: procurement platforms on left, commerce on right */
.pc-platform-palette{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) 48px minmax(0,.9fr);
  align-items:end;
  gap:16px;
  padding-bottom:22px;
  border-bottom:1px solid var(--line);
}

.pc-platform-group{
  min-width:0;
}

.pc-platform-group__label{
  display:block;
  margin-bottom:10px;
  color:var(--muted);
  font-size:.54rem;
  font-weight:800;
  letter-spacing:.11em;
  text-transform:uppercase;
}

.pc-platform-group--commerce .pc-platform-group__label{
  text-align:right;
}

.pc-platform-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.pc-platform-group--commerce .pc-platform-row{
  justify-content:flex-end;
}

.pc-platform-divider{
  display:grid;
  place-items:center;
  height:66px;
  color:#92969D;
  font-size:1rem;
}

.pc-brand-choice{
  --logo-scale:1;
  position:relative;
  flex:0 1 112px;
  min-width:82px;
  height:62px;
  display:grid;
  place-items:center;
  padding:8px;
  border:1px solid rgba(32,33,36,.075);
  border-radius:13px;
  background:#fff;
  cursor:grab;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
}

.pc-brand-choice:hover{
  transform:translateY(-2px);
  border-color:rgba(33,110,101,.22);
  box-shadow:0 10px 24px rgba(32,33,36,.055);
}

.pc-brand-choice:active{
  cursor:grabbing;
}

.pc-brand-choice.is-coming-soon img{
  filter:grayscale(1) saturate(0) contrast(1.08);
  opacity:.58;
}

.pc-brand-choice__logo{
  width:100%;
  height:32px;
  display:grid;
  place-items:center;
}

.pc-brand-choice__logo img{
  display:block;
  width:auto;
  height:var(--software-logo-height);
  max-width:var(--software-logo-max-width);
  max-height:var(--software-logo-height);
  object-fit:contain;
  object-position:center;
  transform:scale(var(--logo-scale,1));
  transform-origin:center;
}

.pc-brand-choice__fallback{
  display:none;
}

/* Three-step guidance, intentionally compact */
.pc-integration-guide{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  padding:16px 0 4px;
  color:#686C72;
  font-size:.60rem;
  font-weight:700;
}

.pc-integration-guide span{
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
}

.pc-integration-guide b{
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:var(--graphite);
  background:var(--punchout);
  font-size:.48rem;
}

.pc-integration-guide i{
  color:#A7ABB0;
  font-style:normal;
}

/* Connection zone */
.pc-integration-route{
  min-height:248px;
  display:grid;
  grid-template-columns:minmax(190px,1fr) minmax(66px,.44fr) 142px minmax(66px,.44fr) minmax(190px,1fr);
  align-items:center;
  gap:10px;
  margin-top:18px;
  padding:28px;
  border:1px solid rgba(32,33,36,.07);
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 50%,rgba(153,254,237,.19),transparent 29%),
    radial-gradient(circle at 50% 50%,rgba(217,214,253,.10),transparent 49%),
    #fff;
}

.pc-integration-side{
  min-width:0;
}

.pc-integration-side__label{
  display:block;
  margin-bottom:8px;
  text-align:center;
  color:var(--muted);
  font-size:.49rem;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.pc-integration-drop{
  min-width:0;
  min-height:136px;
  padding:13px;
  border:1px dashed rgba(32,33,36,.20);
  border-radius:18px;
  background:rgba(248,249,247,.70);
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}

.pc-integration-drop.is-dragover{
  transform:scale(1.015);
  border-color:var(--punchout-dark);
  background:var(--punchout-soft);
}

.pc-integration-drop.has-selection{
  border-style:solid;
  border-color:rgba(32,33,36,.09);
  background:#fff;
}

.pc-integration-drop__selection{
  width:100%;
  min-height:108px;
  display:flex;
  flex-wrap:wrap;
  align-content:center;
  justify-content:center;
  gap:8px;
}

.pc-integration-drop__empty{
  align-self:center;
  color:rgba(32,33,36,.24);
  font-size:1.55rem;
  font-weight:400;
}

/* Multiple connection instances */
.pc-drop-logo{
  --logo-scale:1;
  position:relative;
  width:94px;
  height:52px;
  display:grid;
  place-items:center;
  padding:7px;
  border:1px solid rgba(32,33,36,.075);
  border-radius:12px;
  background:#F8F9F7;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;
}

.pc-drop-logo:hover{
  transform:translateY(-1px);
  border-color:rgba(33,110,101,.18);
  background:var(--punchout-soft);
}

.pc-drop-logo img{
  display:block;
  width:auto;
  height:var(--software-logo-height);
  max-width:var(--software-logo-max-width);
  max-height:var(--software-logo-height);
  object-fit:contain;
  transform:scale(var(--logo-scale,1));
  transform-origin:center;
}

.pc-drop-logo.is-coming-soon img{
  filter:grayscale(1) saturate(0) contrast(1.08);
  opacity:.58;
}

.pc-drop-logo::after{
  content:"×";
  position:absolute;
  right:4px;
  top:3px;
  color:#A1A5AA;
  font-size:.60rem;
  line-height:1;
  opacity:0;
  transition:opacity .18s ease;
}

.pc-drop-logo:hover::after{
  opacity:1;
}

/* Central hub */
.pc-route-hub{
  width:142px;
  height:142px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid rgba(32,33,36,.08);
  border-radius:50%;
  color:var(--graphite);
  background:
    radial-gradient(circle at 68% 16%,rgba(255,255,255,.72),transparent 25%),
    var(--punchout);
  box-shadow:0 17px 40px rgba(32,33,36,.08),inset 0 0 0 7px rgba(255,255,255,.22);
  transition:transform .3s ease,box-shadow .3s ease;
}

.pc-route-hub span{
  color:#39736B;
  font-size:.45rem;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.pc-route-hub strong{
  margin-top:3px;
  font-size:1.04rem;
  line-height:.95;
  letter-spacing:-.05em;
}

.pc-route-hub small{
  margin-top:6px;
  color:rgba(32,33,36,.60);
  font-size:.42rem;
  font-weight:800;
}

.pc-integration-lab.is-connected .pc-route-hub{
  transform:scale(1.035);
  box-shadow:0 21px 48px rgba(32,33,36,.10),inset 0 0 0 7px rgba(255,255,255,.24);
}

/* Two-way data flow */
.pc-route-track{
  height:2px;
  position:relative;
  overflow:visible;
  background:repeating-linear-gradient(90deg,rgba(51,99,93,.42) 0 4px,transparent 4px 10px);
  opacity:.32;
  transition:opacity .25s ease;
}

.pc-integration-lab.is-connected .pc-route-track{
  opacity:1;
}

.pc-route-packet{
  position:absolute;
  top:50%;
  left:0;
  width:8px;
  height:8px;
  margin-top:-4px;
  border-radius:50%;
  opacity:0;
  box-shadow:0 0 0 5px rgba(153,254,236,.13);
}

.pc-route-packet--forward{
  background:var(--punchout-dark);
}

.pc-route-packet--return{
  background:#776AC8;
}

.pc-integration-lab.is-connected .pc-route-track--left .pc-route-packet--forward,
.pc-integration-lab.is-connected .pc-route-track--right .pc-route-packet--forward{
  animation:pcRouteForward 2.65s ease-in-out infinite;
}

.pc-integration-lab.is-connected .pc-route-track--left .pc-route-packet--return,
.pc-integration-lab.is-connected .pc-route-track--right .pc-route-packet--return{
  animation:pcRouteReturn 2.65s ease-in-out infinite .78s;
}

@keyframes pcRouteForward{
  0%{left:0;opacity:0}
  14%{opacity:1}
  86%{opacity:1}
  100%{left:calc(100% - 8px);opacity:0}
}

@keyframes pcRouteReturn{
  0%{left:calc(100% - 8px);opacity:0}
  14%{opacity:1}
  86%{opacity:1}
  100%{left:0;opacity:0}
}

.pc-integration-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-top:14px;

  border-radius:999px;

  font-size:.60rem;
  font-weight:800;

}

  border-color:rgba(32,33,36,.24);
}
